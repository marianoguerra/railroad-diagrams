<svg xmlns="http://www.w3.org/2000/svg" class="rrd-diagram" viewBox="0 0 340 45" width="340" height="45" role="img" aria-label="Main"><title>Main</title><style>.rrd-diagram{--rrd-stroke:#222;--rrd-fill:#fff;--rrd-terminal:#f7f7f7;color:var(--rrd-stroke);font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:15px}.rrd-rail{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.rrd-station rect{fill:var(--rrd-fill);stroke:currentColor;stroke-width:2}.rrd-terminal rect{fill:var(--rrd-terminal)}.rrd-station text{text-anchor:middle;dominant-baseline:central}.rrd-marker{text-anchor:middle;dominant-baseline:central}.rrd-label{font-size:.8em;dominant-baseline:auto}</style><g transform="translate(10 33)"><g class="rrd-rails"><g class="rrd-rail-layer"><path class="rrd-rail" d="M0 1H320"/></g></g><g class="rrd-content"><g class="rrd rrd-empty"><text class="rrd-label" x="0" y="-6">Main</text></g></g></g></svg>